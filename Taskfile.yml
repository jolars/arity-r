version: "3"

tasks:
  default:
    deps: [install]

  document:
    desc: Regenerate roxygen docs and NAMESPACE
    cmds:
      - Rscript -e 'devtools::document(roclets = c("rd", "collate", "namespace"))'

  extendr-document:
    desc: Regenerate extendr R wrappers and Rust module registration
    cmds:
      - task: extendr-wrappers
      - Rscript -e 'devtools::document()'

  extendr-wrappers:
    desc: Regenerate extendr R wrappers
    internal: true
    dir: src
    cmds:
      - cargo run --locked --bin document --manifest-path=rust/Cargo.toml --target-dir=rust/target

  vendor-pkgs:
    desc: Re-vendor Rust dependencies for offline package builds
    cmds:
      - rm -rf src/.cargo src/vendor src/rust/vendor src/rust/vendor.tar.xz
      - cargo generate-lockfile --manifest-path src/rust/Cargo.toml
      - cargo vendor --locked --manifest-path src/rust/Cargo.toml src/rust/vendor
      - >-
        find src/rust/vendor -type f -name AGENTS.md
        -execdir cp {{.TASKFILE_DIR}}/tools/vendor-agent-override.md
        AGENTS.override.md \;
      - tar -cJ --no-xattrs -f src/rust/vendor.tar.xz -C src/rust vendor
      - rm -rf src/rust/vendor

  rust-fmt:
    desc: Check Rust formatting
    dir: src/rust
    cmds:
      - cargo fmt -- --check

  rust-test:
    desc: Run Rust unit tests
    dir: src/rust
    cmds:
      - cargo test --locked

  rust-clippy:
    desc: Run Rust lints
    dir: src/rust
    cmds:
      - cargo clippy --locked --all-targets -- -D warnings

  build:
    desc: Build package tarball without the manual
    deps: [document]
    cmds:
      - R CMD build --no-manual .

  build-cran:
    desc: Build CRAN-style package tarball
    cmds:
      - R CMD build .

  install:
    desc: Install the package
    cmds:
      - R CMD INSTALL --no-multiarch --with-keep.source .

  clean-install:
    desc: Install the package after cleaning native artifacts
    cmds:
      - R CMD INSTALL --preclean --no-multiarch --with-keep.source .

  check:
    desc: Check the built R source package
    deps: [build]
    cmds:
      - _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual arity_*.tar.gz

  test:
    desc: Run testthat tests
    cmds:
      - Rscript -e 'devtools::test()'

  readme:
    desc: Regenerate README.md from README.Rmd
    cmds:
      - Rscript -e 'devtools::build_readme()'

  clean:
    desc: Remove native build artifacts and unpacked vendor state
    cmds:
      - >-
        rm -rf src/*.o src/*.so src/*.dll src/symbols.rds src/rust/target
        src/rust/vendor src/.cargo src/vendor
